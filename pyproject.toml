[project]
name = "mcp-is-muni"
version = "0.1.0"
description = "Model Context Protocol (MCP) Server for Masaryk University Information System (IS MU)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "mcp-is-muni contributors" }
]
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=5.0.0",
    "lxml>=5.0.0",
]

[project.scripts]
mcp-is-muni = "mcp_is_muni.server:main"
mcp-is-muni-auth = "mcp_is_muni.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_is_muni"]
only-include = ["mcp_is_muni", "server.py", "is_client.py", "auth_helper.py"]
